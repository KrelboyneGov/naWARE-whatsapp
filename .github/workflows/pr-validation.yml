name: PR Validation

# Tier: on demand only (docs/adr/0001-release-pipeline.md; hub: monorepos/release-gated-verification.md).
# Not triggered by pull requests: with a single owner and no branch protection a PR check is
# advisory — it bills every push and verifies nothing the Lefthook pre-push
# (`pnpm run verify`) has not already verified for free. Dispatch it from the Actions tab
# after a risky change (lockfile, workflows, scripts/, build config).
#
# Reopen (back to pull_request) when a second person merges to main, or branch protection
# makes the check required — then it is a guarantee instead of a notification.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Node and pnpm versions come from mise.toml, the same file developers use locally.
      - name: Setup Node and pnpm (mise)
        uses: jdx/mise-action@v2

      # Keyed on inputs, never on github.sha: cache entries are immutable, so a per-SHA
      # key mints a new entry on every push. cache-cleanup.yml deletes a PR's entries
      # when it closes.
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache turbo outputs
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm exec oxfmt --check .

      - name: Build packages
        run: pnpm run build --filter='@emergency-map/*'

      - name: Type check
        run: pnpm run check-types

      - name: Test
        run: pnpm run test

      - name: Build app
        working-directory: apps/web-hono
        env:
          VITE_SERVER_URL: https://placeholder.example.com
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          BETTER_AUTH_SECRET: placeholder-secret-for-build-validation
        run: pnpm run build

      - name: Build backend
        working-directory: apps/server-hono
        run: pnpm run build
