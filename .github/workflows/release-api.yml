name: Release API

# Tier: release (docs/adr/0001-release-pipeline.md; hub: monorepos/release-gated-verification.md R1,
# monorepos/worker-secrets-with-deploy.md). Ships apps/server-hono to the `server-hono-api` Worker
# when release-please cuts a release (single version line, tag `vX.Y.Z`, ADR 0007), or on
# manual dispatch with an existing tag.
#
# `verify` runs the root `pnpm run verify` on the tagged SHA in a clean environment and `deploy`
# needs it: nothing publishes without a green verification in front of it. Database migrations
# run before the Worker deploy, and Worker secrets travel inside the same `wrangler deploy`
# through --secrets-file (a separate `secret put` step deploys on its own and is refused once a
# version was uploaded without being deployed).
#
# Reopen: when a second deployable environment (staging) is needed, add a job keyed on a tag
# prefix (`api-staging-v*`) or on the dispatch input, never on a long-lived branch.

on:
  # Called by release-please.yml when a release is cut (tag vX.Y.Z), with that tag as `ref`.
  workflow_call:
    inputs:
      ref:
        description: Git ref (release tag) to build and deploy
        type: string
        required: true
  # Manual re-run or rollback: pass an existing tag, e.g. v0.1.0.
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (release tag) to build and deploy
        type: string
        required: true

concurrency:
  group: release-api-${{ inputs.ref }}
  cancel-in-progress: false

env:
  # Mirrors workspaces.catalog.wrangler in the root package.json. Bump both together.
  WRANGLER_VERSION: 4.110.0

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # Node and pnpm versions come from mise.toml, the same file developers use locally.
      - name: Setup Node and pnpm (mise)
        uses: jdx/mise-action@v2

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (lint, format, package builds, types, tests)
        run: pnpm run verify

      - name: Build API bundle
        working-directory: apps/server-hono
        run: pnpm run build

  deploy:
    name: Deploy API Worker
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # Node and pnpm versions come from mise.toml, the same file developers use locally.
      - name: Setup Node and pnpm (mise)
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build --filter='@emergency-map/*'

      # drizzle-kit reads DATABASE_URL; migrations must use the direct (non-pooled) Neon string.
      - name: Run database migrations
        working-directory: packages/infra-db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
        run: pnpm run db:migrate

      # jq escapes quotes and backslashes; empty values are dropped so a missing GitHub secret
      # keeps the Worker's last good value instead of blanking it (--secrets-file is additive).
      - name: Write Worker secrets file
        working-directory: apps/server-hono
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
        run: |
          umask 077
          jq -n \
            --arg DATABASE_URL "$DATABASE_URL" \
            --arg BETTER_AUTH_SECRET "$BETTER_AUTH_SECRET" \
            --arg CORS_ORIGIN "$CORS_ORIGIN" \
            '$ARGS.named | with_entries(select(.value != ""))' > worker-secrets.json

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          packageManager: pnpm
          workingDirectory: apps/server-hono
          command: deploy --secrets-file worker-secrets.json

      - name: Remove Worker secrets file
        if: always()
        run: rm -f apps/server-hono/worker-secrets.json

      # Optional: set the repository variable API_URL (e.g. https://server-hono-api.<account>.workers.dev)
      # to probe the health endpoint after the deploy.
      - name: Smoke check
        if: vars.API_URL != ''
        env:
          API_URL: ${{ vars.API_URL }}
        run: curl --fail --silent --show-error --max-time 20 "$API_URL/api/v1/health"
