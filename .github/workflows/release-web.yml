name: Release Web

# Tier: release (docs/adr/0001-release-pipeline.md; hub: monorepos/release-gated-verification.md R1,
# monorepos/worker-secrets-with-deploy.md). Ships apps/web-hono (TanStack Start) to the `web-hono`
# Worker when a `web-v*.*.*` tag is pushed, or on manual dispatch from the Actions tab.
#
# `verify` runs the root `pnpm run verify` on the tagged SHA and `deploy` needs it. The web Worker is
# a pure proxy client: it reaches the API through the `API_SERVICE` Service Binding declared in
# wrangler.jsonc, so the API Worker (`server-hono-api`) must already exist. First deploy order:
# Release API, then Release Web. After that they ship independently.
#
# Reopen: when a second deployable environment (staging) is needed, add a job keyed on a tag
# prefix or a dispatch input, never on a long-lived branch.

on:
  push:
    tags:
      - "web-v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-web
  cancel-in-progress: false

env:
  # Mirrors workspaces.catalog.wrangler in the root package.json. Bump both together.
  WRANGLER_VERSION: 4.110.0

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Node and pnpm versions come from mise.toml, the same file developers use locally.
      - name: Setup Node and pnpm (mise)
        uses: jdx/mise-action@v2

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (lint, format, package builds, types, tests)
        run: pnpm run verify

      - name: Build web app
        working-directory: apps/web-hono
        env:
          VITE_SERVER_URL: https://placeholder.example.com
        run: pnpm run build

  deploy:
    name: Deploy Web Worker
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Node and pnpm versions come from mise.toml, the same file developers use locally.
      - name: Setup Node and pnpm (mise)
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build --filter='@emergency-map/*'

      # The web app only needs the backend URL: it never runs Better Auth or touches the database.
      - name: Build web app
        working-directory: apps/web-hono
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
        run: pnpm run build

      - name: Write Worker secrets file
        working-directory: apps/web-hono
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
        run: |
          umask 077
          jq -n \
            --arg VITE_SERVER_URL "$VITE_SERVER_URL" \
            '$ARGS.named | with_entries(select(.value != ""))' > worker-secrets.json

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          packageManager: pnpm
          workingDirectory: apps/web-hono
          command: deploy --secrets-file worker-secrets.json

      - name: Remove Worker secrets file
        if: always()
        run: rm -f apps/web-hono/worker-secrets.json

      # Optional: set the repository variable WEB_URL to probe the deployed site.
      - name: Smoke check
        if: vars.WEB_URL != ''
        env:
          WEB_URL: ${{ vars.WEB_URL }}
        run: curl --fail --silent --show-error --max-time 20 -o /dev/null "$WEB_URL"
